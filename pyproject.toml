[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payloadofallducks"
version = "0.2.1"
description = "Context-aware offline security payload wordlist generator for Burp Suite Intruder (CTFs and authorised testing)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PayloadOfAllDucks contributors" }]
keywords = [
    "security",
    "pentest",
    "ctf",
    "wordlist",
    "payloads",
    "burp",
    "fuzzing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = ["pytest>=7.0", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/171k/PayloadOfAllDucks"
Repository = "https://github.com/171k/PayloadOfAllDucks"
Issues = "https://github.com/171k/PayloadOfAllDucks/issues"

[project.scripts]
poad = "poad.cli:main"

[tool.setuptools.packages.find]
include = ["poad*"]

[tool.setuptools.package-data]
poad = ["templates/**/*.json", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
